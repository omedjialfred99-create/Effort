<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupérer mon espace - Clinique Effort</title>
    <link rel="stylesheet" href="structure.css">
</head>
<body>
    <main class="admin-page">
        <section class="panel" id="reset-panel">
            <h1>Récupérer mon espace</h1>
            <p>Choisissez un nouveau mot de passe (8 caractères minimum).</p>
            <form id="reset-form">
                <label for="password">Nouveau mot de passe</label>
                <input id="password" type="password" minlength="8" required>
                <label for="confirmation">Confirmer le mot de passe</label>
                <input id="confirmation" type="password" minlength="8" required>
                <button type="submit">Enregistrer le mot de passe</button>
            </form>
            <p id="reset-message" class="message"></p>
        </section>
    </main>
    <script>
        const form = document.getElementById('reset-form');
        const message = document.getElementById('reset-message');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('confirmation').value) {
                message.textContent = 'Les mots de passe ne correspondent pas.';
                return;
            }
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: new URLSearchParams(location.search).get('token'),
                        password
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Impossible de modifier le mot de passe');
                message.textContent = data.message;
                form.reset();
            } catch (error) {
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
